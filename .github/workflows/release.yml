name: Release

# Pushing a version tag builds the installers on the three OSes and drafts a GitHub Release with them.
# Test builds (26.2.0-a.1, -b.1, -rc.1) are marked as prereleases. The draft is published by hand.
on:
  push:
    tags:
      - "[0-9]*.*.*"

permissions:
  contents: read

jobs:
  installers:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches version.properties
        run: |
          version=$(grep '^app.version=' version.properties | cut -d= -f2 | tr -d '\r')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.version=$version"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test and package
        run: ./gradlew build jpackage

      - name: Portable ZIP
        if: runner.os == 'Linux'
        run: ./gradlew portableZip

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            desktop/build/installer/*
            desktop/build/distributions/*-portable.zip
          if-no-files-found: error

  draft:
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The notes start with the guide to the files (release-downloads.md), then the generated changelog
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          sed -e "s/{version}/$GITHUB_REF_NAME/g" .github/release-downloads.md > notes.md
          # Each artifact keeps its folders (installer/, distributions/): upload the files, not the folders
          mapfile -t files < <(find artifacts -type f)
          # The installers are unsigned: the hashes let players check a download (README: Verifying downloads)
          (for f in "${files[@]}"; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")"); done) > SHA256SUMS.txt
          files+=(SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --draft $prerelease \
            --title "HopSync $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
