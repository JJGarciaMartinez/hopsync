# HopSync dark theme, loaded by FlatLaf on top of FlatDarkLaf.properties because it sits next to
# HopSyncDark.class. Elevation: raised = press, sunken = type or choose, flat = information.

#---- Palette ----

# Tinta, turquesa y coral: the box (brand) is ink, what the player already has is turquoise, what arrives is coral.
# Values are copied from the final app preview, never approximated.
@background = #141317
@foreground = #EEECF2
@accentColor = #FF6B4A
@disabledForeground = #6E6B78

HopSync.background = @background
HopSync.surface = #1B1A20
HopSync.well = #0D0C10
HopSync.edge = #3A3843
HopSync.line = #2D2B34
HopSync.sidebar = #111015
HopSync.statusBar = #100F13
HopSync.raised = #25232B
HopSync.rowHover = #19181D
HopSync.rowDetail = #17161B
HopSync.text = @foreground
HopSync.textSecondary = #9D9AA6
HopSync.textFaint = #6E6B78
# The box of the mark, brand titles and the toast
HopSync.brand = #E9E6EF
# What the player already has: progress, up to date, valid link, focus
HopSync.mine = #2EC4B6
# What arrives: the primary action and new mods
HopSync.action = @accentColor
HopSync.added = @accentColor
HopSync.update = #F2B24A
# Rose, so an error never reads as the coral primary action
HopSync.error = #F2668B
HopSync.focus = $HopSync.mine
# The mark on paper: documents, the web, print
HopSync.print.paper = #F5F4F7
HopSync.print.box = #2A2733
HopSync.print.mine = #0E7A71
HopSync.print.action = #C23A1C

Label.disabledForeground = @disabledForeground
Separator.foreground = $HopSync.edge
Component.borderColor = $HopSync.edge
Component.disabledBorderColor = #2A2E32
TextComponent.selectAllOnFocusPolicy = never

#---- Font ----

# Relative sizes keep FlatLaf's scale factor, which it derives from the system font size. Windows starts
# at 12 and macOS at 13; Linux follows the desktop font setting.
[win]defaultFont = +1

#---- Shape and focus ----

Component.arc = 8
TextComponent.arc = 20
Component.focusWidth = 3
Component.innerFocusWidth = 0
Component.focusColor = fade($HopSync.focus,20%)
Component.focusedBorderColor = $HopSync.focus

#---- Raised: what can be pressed (painted by RaisedButtonUI and Relief) ----

# Each button role: face gradient top to bottom, border (lighter on top, darker at the bottom edge) and the
# bevel under the face. At rest the bevel shows bevelWidth; hover lifts the face 1 px more; pressed drops
# the face onto it. Values from the identity plan, phase 3.
HopSync.bevelWidth = 2
HopSync.bevelWidth.primary = 3
HopSync.button.highlight = fade(#FFFFFF,8%)
HopSync.button.disabled = #1F1E24

HopSync.button.primary.top = #FF8A6B
HopSync.button.primary.bottom = #F2603F
HopSync.button.primary.hoverTop = #FF9879
HopSync.button.primary.hoverBottom = #F76B4A
HopSync.button.primary.border = #E2583A
HopSync.button.primary.hoverBorder = #E2583A
HopSync.button.primary.borderBottom = #9E2E14
HopSync.button.primary.bevel = #8A2711
HopSync.button.primary.highlight = fade(#FFFFFF,35%)

HopSync.button.secondary.top = #36333E
HopSync.button.secondary.bottom = #2A2830
HopSync.button.secondary.hoverTop = #3E3B47
HopSync.button.secondary.hoverBottom = #312E38
HopSync.button.secondary.border = #45424F
HopSync.button.secondary.hoverBorder = #55515F
HopSync.button.secondary.borderBottom = #18171C
HopSync.button.secondary.bevel = #08080A

HopSync.button.quiet.top = #2A2830
HopSync.button.quiet.bottom = #232128
HopSync.button.quiet.hoverTop = #3E3B47
HopSync.button.quiet.hoverBottom = #312E38
HopSync.button.quiet.border = #45424F
HopSync.button.quiet.hoverBorder = #55515F
HopSync.button.quiet.borderBottom = #18171C
HopSync.button.quiet.bevel = #08080A

HopSync.button.danger.top = #3A2229
HopSync.button.danger.bottom = #2E1B21
HopSync.button.danger.hoverTop = #452830
HopSync.button.danger.hoverBottom = #37212A
HopSync.button.danger.border = #6B3445
HopSync.button.danger.hoverBorder = #8A4458
HopSync.button.danger.borderBottom = #2A1218
HopSync.button.danger.bevel = #170A0E

# Raised elements that are not buttons: the selected pack and the chosen segment
HopSync.selected.top = #2E2B35
HopSync.selected.bottom = #26242C
HopSync.segment.top = #3A3742
HopSync.segment.bottom = #2E2B35
HopSync.raised.border = #45424F
HopSync.raised.bevel = #050506
HopSync.raised.highlight = fade(#FFFFFF,7%)
# Flat rows under the mouse
HopSync.hoverTint = #FFFFFF09

Button.arc = 20
Button.borderWidth = 0
Button.default.borderWidth = 0
Button.margin = 6,16,6,16
Button.foreground = @foreground
Button.disabledText = @disabledForeground
Button.default.foreground = #2A0D05
Button.default.boldText = true

[style]Button.primary = foreground: #2A0D05; font: bold
[style]Button.quiet = foreground: $HopSync.textSecondary; hoverForeground: @foreground
[style]Button.danger = foreground: $HopSync.error
[style]Button.small = margin: 3,10,3,10; font: -1
[style]Button.icon = margin: 0,0,0,0

#---- Sunken: text fields (border painted by SunkenBorder) ----

# Sunken: fields, the search box, segment tracks and progress bars sit in the surface
HopSync.sunken.border = #2B2932
HopSync.sunken.topEdge = #050506
HopSync.innerShadow = fade(#000000,60%)

TextField.background = $HopSync.well
FormattedTextField.background = $HopSync.well
PasswordField.background = $HopSync.well
TextField.inactiveBackground = $HopSync.well
FormattedTextField.inactiveBackground = $HopSync.well
PasswordField.inactiveBackground = $HopSync.well

#---- Flat: progress ----

ProgressBar.arc = 8
ProgressBar.background = $HopSync.well
ProgressBar.foreground = $HopSync.mine
ProgressBar.selectionForeground = @background
ProgressBar.selectionBackground = @foreground
