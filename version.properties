# HopSync version configuration
# Single source of truth for version, app name and vendor; read by Gradle and by the app at runtime
# app.version is YY.MAJOR.FIXES or YY.MAJOR.FIXES-(a|b|rc).N; Gradle derives the installers' number (VERSION_GUIDE.md)
app.version=26.2.0
app.name=HopSync
app.vendor=HopSync

# Windows Installer UUID - NEVER CHANGE THIS.
# This UUID allows Windows to recognize updates to the same application
# If changed, users will need to manually uninstall the old version
app.win.upgrade.uuid=15e62c20-ca8b-431d-b60b-7a64340ad138
